name: trigger-site-build

# On every push to main (i.e. after a publish-cycle), POST to the site's
# deploy hook so the public leaderboard rebuilds with the latest audit
# data. The deploy hook URL is created in the hosting provider's dashboard
# for the site project's `main` branch and stored in this repo's secrets as
# `SITE_DEPLOY_HOOK`.

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST to the site deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK secret not set, skipping site rebuild."
            echo "Set the secret in repo Settings → Secrets and variables → Actions"
            echo "to enable automatic site rebuilds on audit pushes."
            exit 0
          fi
          curl -sS -X POST -f "$DEPLOY_HOOK"
          echo "Site rebuild triggered."
